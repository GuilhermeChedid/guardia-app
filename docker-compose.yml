services:
  db_guardia:
    image: postgres:15-alpine
    container_name: postgres_guardia
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: guardia_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - guardia-network

  api:
    build: ./backend
    container_name: api_guardia
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://root:rootpassword@db_guardia:5432/guardia_db
      - EVIDENCE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    depends_on:
      - db_guardia
    networks:
      - guardia-network

volumes:
  pgdata:

networks:
  guardia-network:
    driver: bridge
