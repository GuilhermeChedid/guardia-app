<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link rel="stylesheet" href="perfil.css">
    <!-- Importando as fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=PT+Serif:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <!-- Header / Topo -->
        <header class="header">
            <!-- Navegação Superior -->
            <div class="nav-top">
                <button class="back-btn">
                    <svg width="10" height="16" viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8.5 15L1.5 8L8.5 1" stroke="white" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <h1 class="screen-title">Editar Perfil</h1>
                <div class="spacer"></div>
            </div>
        </header>

        <!-- Conteúdo Principal Scrollável -->
        <main class="content">

            <!-- Foto de Perfil -->
            <div class="profile-section">
                <div class="avatar-container">
                    <div class="avatar">M</div>
                    <button class="edit-avatar-btn">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8.5 1.5L10.5 3.5L3.5 10.5H1.5V8.5L8.5 1.5Z" stroke="white" stroke-width="1.2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
                <p class="avatar-hint">Toque para alterar a foto</p>
            </div>

            <!-- Formulário -->
            <form class="edit-form">
                <div class="form-group">
                    <label>NOME COMPLETO</label>
                    <input type="text" value="Maria Clara Santos">
                </div>

                <div class="form-group">
                    <label>E-MAIL</label>
                    <input type="email" value="mariaclara@email.com">
                </div>

                <div class="form-group">
                    <label>TELEFONE</label>
                    <input type="tel" value="(11) 98765-4321">
                </div>

                <div class="form-group">
                    <label>ENDEREÇO</label>
                    <input type="text" value="Rua das Flores, 42 — São Paulo, SP">
                </div>

                <div class="form-group">
                    <label>ESTADO CIVIL</label>
                    <div class="select-wrapper">
                        <select>
                            <option>Solteira</option>
                            <option>Casada</option>
                        </select>
                        <svg class="chevron" width="10" height="6" viewBox="0 0 10 6" fill="none">
                            <path d="M1 1L5 5L9 1" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" value="***.456.***-00" class="disabled-input" readonly>
                    <span class="helper-text">O CPF não pode ser alterado</span>
                </div>
            </form>

            <button type="button" class="save-btn">Salvar alterações</button>
        </main>

        <!-- Navegação Inferior (Bottom Bar) -->
        <nav class="bottom-nav">
            <a href="../Home/Home.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Início</span>
            </a>
            <a href="../Contatos/contatos.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Contatos</span>
            </a>
            <a href="../Provas/provas.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Provas</span>
            </a>
            <a href="../Support/informacoes.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <span>Informações</span>
            </a>
            <a href="../Perfil/perfil.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Perfil</span>
                <div class="active-dot"></div>
            </a>
        </nav>

    </div>
</body>

</html>
