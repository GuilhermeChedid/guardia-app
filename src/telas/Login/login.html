<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiã - Login</title>
    <!-- Importando FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="app-container">
        <!-- Header / Top Section -->
        <div class="top-section">
            <!-- Efeitos de fundo (Círculos desfocados) -->
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>

            <div class="logo-container">
                <div class="logo-box">
                    <img src="../../assets/imagens/logo_guardia.png" class="custom-logo" alt="Logo Guardia">
                </div>
                <h1 class="brand-title">Guardiã</h1>
                <p class="brand-subtitle">Sua segurança, sempre com você</p>
            </div>
        </div>

        <!-- Form / Bottom Section -->
        <div class="bottom-section">
            <h2 class="welcome-title">Bem-vinda de volta</h2>
            <p class="welcome-subtitle">Entre com sua conta para continuar</p>

            <form class="login-form">
                <div class="form-group">
                    <label for="email">E-mail <span class="required">*</span></label>
                    <div class="input-container">
                        <i class="fa-regular fa-envelope icon-left"></i>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Senha <span class="required">*</span></label>
                    <div class="input-container">
                        <i class="fa-solid fa-lock icon-left"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye icon-right"></i>
                    </div>
                </div>

                <a href="#" class="forgot-password">Esqueci minha senha</a>

                <button type="submit" class="btn-primary">Entrar</button>

                <div class="divider">
                    <span>ou</span>
                </div>

                <p class="register-text">
                    Não tem uma conta? <a href="../cadastro/cadastro.html" class="register-link">Cadastre-se</a>
                </p>
            </form>
        </div>
    </div>
</body>

</html>
